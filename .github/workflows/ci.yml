name: CI

# Run on every push and pull request to main. This is the safety net that
# prevents broken code from landing — previously every workflow in this repo
# was `workflow_dispatch` (manual only), so nothing gated `main`.
#
# Scope (intentionally minimal for the first iteration):
#   - Rust: `cargo test` (must pass). `cargo clippy` runs but does NOT block
#     (-D warnings is too strict today: ~200 pre-existing lints across the
#     codebase; flipping them is a separate cleanup task).
#   - Frontend: `tsc --noEmit` on src/ only. `next lint` is skipped because
#     the project has no ESLint config yet.
#
# Adding stricter checks later (clippy -D warnings, eslint, vitest) is a
# matter of editing this file once the underlying debt is paid down.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend/src-tauri
    env:
      # Skip FFmpeg download + tauri_build's sidecar verification. Unit tests
      # don't exercise the runtime sidecars (FFmpeg, llama-helper), and pulling
      # 100MB FFmpeg on every run — plus tauri_build hard-failing on the missing
      # llama-helper binary that has no download path — would block CI forever.
      # The build.rs honors this; local dev leaves it unset for real builds.
      MEETILY_SKIP_SIDECAR_VERIFY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Cache ~/.cargo AND target/ — without this, a fresh CI run recompiles
      # the whole dependency tree (~5+ min). With it, runs after the first are
      # typically under a minute when no Cargo.toml changed.
      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Build tests
        run: cargo test --lib --no-run

      - name: Run tests
        run: cargo test --lib --no-fail-fast

      # Non-blocking clippy: surfaces lints for visibility but does not fail
      # the job. Promote to `-D warnings` once the existing ~200 lints are fixed.
      - name: Clippy (non-blocking)
        run: cargo clippy --lib --all-targets
        continue-on-error: true

  frontend:
    name: Frontend (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          # package.json lives in frontend/, not repo root — without this
          # the action fails with ENOENT looking for /repo/package.json.
          package_json_file: frontend/package.json
          # frontend/package.json has no "packageManager" field, so the
          # action can't auto-detect a version — pin one explicitly.
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Type-check src/ only. The repo has tests/lib/*.test.ts importing from
      # "bun:test" (a pre-existing orphan test file), which tsc would flag.
      # tsconfig.ci.json extends the base config and excludes tests, so CI
      # stays green without touching the legacy file or the dev tsconfig.
      - name: Type-check (src only)
        run: npx tsc --noEmit -p tsconfig.ci.json
